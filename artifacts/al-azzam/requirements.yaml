packages:
  "framer-motion": "For page transitions, smooth layout changes, and premium scroll animations"
  "lucide-react": "Beautiful vector icons for UI elements"
  "react-hook-form": "For robust form state management"
  "@hookform/resolvers": "For Zod schema validation integration"
  "date-fns": "For formatting dates in the admin dashboard and property listings"
  "clsx": "For conditional tailwind class merging"
  "tailwind-merge": "For resolving tailwind class conflicts"

images:
  - path: "artifacts/al-azzam/public/images/hero-bg.png"
    description: "Ultra luxury modern villa exterior at twilight, warm interior lighting glowing, modern architectural lines, dark dramatic sky, photorealistic 8k"
    aspect_ratio: "16:9"
  - path: "artifacts/al-azzam/public/images/pattern-bg.png"
    description: "Subtle geometric arabesque seamless pattern in very dark navy blue with faint gold accents, elegant luxury background texture"
    aspect_ratio: "16:9"
  - path: "artifacts/al-azzam/public/images/logo-icon.png"
    description: "Minimalist modern real estate logo icon featuring a stylized gold geometric house shape on a transparent background, luxury aesthetic"
    aspect_ratio: "1:1"

notes:
  - The API client hooks are generated in @workspace/api-client-react.
  - JWT tokens are stored in localStorage as 'azzam_token'.
  - Bilingual (AR/EN) support implemented using a custom LanguageContext and RTL layout switching.
  - Tailwind v4 is used with @theme inline.
